name: CI / CD - VJ Filter Bot

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build, Test, Publish & Deploy
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: ${{ secrets.DOCKER_REPO }} # e.g. mydockerhubuser/vj-filter-bot

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint || true  # optional: do not fail if no linter configured

      - name: Run tests
        run: npm test

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Deploy to remote server via SSH (pull image & restart)
        uses: appleboy/ssh-action@v0.1.9
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          # Commands executed on remote host:
          script: |
            set -e
            cd ${{ secrets.REMOTE_APP_DIR }} || true
            # if you're using docker-compose:
            docker pull ${{ env.IMAGE_NAME }}:latest
            docker-compose down || true
            docker-compose up -d --remove-orphans
            # or, if using a plain docker run:
            # docker stop vj-filter-bot || true
            # docker rm vj-filter-bot || true
            # docker run -d --name vj-filter-bot --restart=always \
            #   -e TELEGRAM_TOKEN="${TELEGRAM_TOKEN}" \
            #   -p 3000:3000 ${{ env.IMAGE_NAME }}:latest
